<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <?!= include('ui/stylesheet'); ?>
  </head>
  <body>
    <header class="header">
      <h1 id="app-title">読み込み中…</h1>
      <div class="header-meta">
        <span id="user-email" class="muted"></span>
        <a id="sheet-link" class="link" href="#" target="_blank" rel="noopener" hidden>スプレッドシートを開く</a>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <h2 id="form-title">新規登録</h2>
        <form id="item-form" autocomplete="off">
          <input type="hidden" id="item-id" />

          <label for="title">タイトル <span class="required">*</span></label>
          <input type="text" id="title" maxlength="200" required />

          <label for="category">カテゴリ</label>
          <input type="text" id="category" list="category-list" maxlength="100" />
          <datalist id="category-list"></datalist>

          <label for="status">ステータス</label>
          <select id="status"></select>

          <label for="note">メモ</label>
          <textarea id="note" rows="4" maxlength="1000"></textarea>

          <div class="actions">
            <button type="submit" id="submit-button" class="primary">登録する</button>
            <button type="button" id="reset-button" class="ghost">クリア</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="toolbar">
          <input type="search" id="keyword" placeholder="キーワードで絞り込み" />
          <select id="filter-status">
            <option value="">すべてのステータス</option>
          </select>
          <button type="button" id="reload-button" class="ghost">再読み込み</button>
        </div>

        <div id="table-wrapper" class="table-wrapper">
          <table id="item-table">
            <thead>
              <tr>
                <th>タイトル</th>
                <th>カテゴリ</th>
                <th>ステータス</th>
                <th>更新日時</th>
                <th class="col-actions">操作</th>
              </tr>
            </thead>
            <tbody id="item-tbody"></tbody>
          </table>
          <p id="empty-message" class="muted" hidden>データがありません。</p>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="loading" class="loading" hidden><span class="spinner"></span></div>

    <?!= include('ui/javascript'); ?>
  </body>
</html>
